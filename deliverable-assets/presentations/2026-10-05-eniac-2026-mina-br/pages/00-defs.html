<!-- Value labels for bar charts: opt in with options.plugins.vlabels.display = true.
     Registered before ufpel-charts.js builds the charts (it waits for DOMContentLoaded). -->
<script>
  if (typeof Chart !== 'undefined') {
    Chart.register({
      id: 'vlabels',
      afterDatasetsDraw: function (chart) {
        var o = chart.options.plugins && chart.options.plugins.vlabels;
        if (!o || !o.display) return;
        var ctx = chart.ctx, horiz = chart.options.indexAxis === 'y';
        ctx.save();
        ctx.font = (o.weight || 600) + ' ' + (o.size || 14) + 'px Montserrat';
        ctx.fillStyle = o.color || '#14202E';
        chart.data.datasets.forEach(function (ds, di) {
          chart.getDatasetMeta(di).data.forEach(function (bar, i) {
            var v = ds.data[i];
            var txt = o.texts ? o.texts[i] : o.digits != null
              ? Number(v).toLocaleString('pt-BR', { minimumFractionDigits: o.digits, maximumFractionDigits: o.digits })
              : String(v);
            if (horiz) { ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(txt, bar.x + 8, bar.y); }
            else { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(txt, bar.x, bar.y - 6); }
          });
        });
        ctx.restore();
      }
    });
  }
</script>
